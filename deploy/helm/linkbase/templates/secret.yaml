{{- if not .Values.existingSecret }}
{{- if not .Values.secrets.ConnectionStrings__Linkbase }}
{{- fail "Set existingSecret to a Secret holding ConnectionStrings__Linkbase, or secrets.ConnectionStrings__Linkbase." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "linkbase.fullname" . }}
  labels:
    {{- include "linkbase.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
