apiVersion: v1
kind: Service
metadata:
  name: {{ include "linkbase.fullname" . }}
  labels:
    {{- include "linkbase.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "linkbase.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
