# Argo CD deploying the OpenShift Kustomize overlay. Point repoURL at wherever this repo is mirrored, and create the
# linkbase-secrets Secret in the namespace first (see deploy/kustomize/base/secret.example.yaml). Migrations need no hook:
# each pod runs them in its init container.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkbase
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/platform/linkbase.git
    targetRevision: main
    path: deploy/kustomize/overlays/openshift
  destination:
    server: https://kubernetes.default.svc
    namespace: linkbase
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
