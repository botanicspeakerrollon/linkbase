# Argo CD deploying the Helm chart on plain Kubernetes. Point repoURL at wherever this repo is mirrored, and create the
# Secret named by existingSecret in the namespace first. For OpenShift, set route.enabled and leave ingress off.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkbase
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/platform/linkbase.git
    targetRevision: main
    path: deploy/helm/linkbase
    helm:
      valuesObject:
        image:
          repository: registry.example.com/platform/linkbase
          tag: latest
        existingSecret: linkbase-secrets
        ingress:
          enabled: true
          host: linkbase.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: linkbase
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
