# Plain Kubernetes, such as AKS, EKS or an on-prem cluster: an Ingress terminates TLS.
#   kubectl apply -k deploy/kustomize/overlays/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

images:
  - name: linkbase
    newName: ghcr.io/example/linkbase
    newTag: latest
