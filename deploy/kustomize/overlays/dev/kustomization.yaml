# For trying Linkbase in an empty cluster, such as kind, minikube or Docker Desktop: adds a throwaway Postgres and the
# Secret pointing at it. Never for real data: the database has no backups and its password is in this folder.
#   kubectl apply -k deploy/kustomize/overlays/dev
#   kubectl port-forward svc/linkbase 8080:8080
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: linkbase-dev

resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml

secretGenerator:
  - name: linkbase-secrets
    options:
      disableNameSuffixHash: true
    literals:
      - ConnectionStrings__Linkbase=Host=postgres;Port=5432;Database=linkbase;Username=linkbase;Password=dev-only-not-secret
  - name: postgres
    options:
      disableNameSuffixHash: true
    literals:
      - POSTGRES_DB=linkbase
      - POSTGRES_USER=linkbase
      - POSTGRES_PASSWORD=dev-only-not-secret

images:
  - name: linkbase
    newName: linkbase
    newTag: local
