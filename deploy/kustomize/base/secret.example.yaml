# An example only, never applied by the kustomizations. Create the real Secret yourself or with your platform's secret
# store (Vault, Sealed Secrets, External Secrets), with the same name and keys:
#
#   kubectl create secret generic linkbase-secrets \
#     --from-literal=ConnectionStrings__Linkbase='Host=postgres.example;Port=5432;Database=linkbase;Username=linkbase;Password=...'
#
# Other keys it can hold: Anthropic__ApiKey for web import, ConnectionStrings__<name> for other models' databases, and
# OTEL_EXPORTER_OTLP_HEADERS if the collector needs an API key.
apiVersion: v1
kind: Secret
metadata:
  name: linkbase-secrets
type: Opaque
stringData:
  ConnectionStrings__Linkbase: Host=postgres.example;Port=5432;Database=linkbase;Username=linkbase;Password=change-me
