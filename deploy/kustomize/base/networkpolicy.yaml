# Only the app's HTTP port takes traffic. Narrow `from` to your router or ingress controller's namespace if your platform
# allows. Outbound isn't limited, as the database can be anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: linkbase
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
