# Builds in Release and runs every test on each push and pull request. The database tests start Postgres with
# Testcontainers, which uses the runner's Docker, and the browser tests drive Chromium through Playwright.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Linkbase.sln

      - name: Check formatting
        run: dotnet format whitespace Linkbase.sln --verify-no-changes

      # Warnings are errors, from Directory.Build.props.
      - name: Build
        run: dotnet build Linkbase.sln -c Release --no-restore

      - name: Install Chromium for the browser tests
        run: pwsh tests/Linkbase.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: >
          dotnet test tests/Linkbase.Tests -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=minimal"
          --results-directory TestResults

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # The same image a platform would run, built from the Dockerfile, scanned, and described by an SBOM. Nothing is pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t linkbase:${{ github.sha }} .

      # Reports known vulnerabilities without failing the build, since most come from the base image and are fixed by
      # rebuilding when Microsoft updates it.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: linkbase:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Describe the image as an SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: linkbase:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Keep the SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # The demo from nothing, as someone trying it would run it: an empty Postgres, the setup step that creates and fills each
  # model's database, then the app. Fails if setup fails or the app doesn't report every model's database ready.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Start the demo
        run: docker compose -f docker-compose.demo.yml up --build -d

      - name: Wait until the app is ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "The demo never became ready" >&2
          exit 1

      - name: Show the setup output
        if: always()
        run: docker compose -f docker-compose.demo.yml logs setup

      - name: Stop the demo
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v
