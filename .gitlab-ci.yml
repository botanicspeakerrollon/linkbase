# The GitLab equivalent of .github/workflows/ci.yml, for self-hosted GitLab, such as an on-prem bank's with Kubernetes or
# OpenShift runners. It needs no Docker daemon and no Docker-in-Docker:
#   - tests use a `services: postgres` container instead of Testcontainers, through LINKBASE_TEST_CONNECTION;
#   - the image is built with Buildah and pushed to this project's registry;
#   - Trivy scans the image and keeps an SBOM.
#
# Behind a registry mirror, set SDK_IMAGE, RUNTIME_IMAGE, POSTGRES_IMAGE, BUILDAH_IMAGE and TRIVY_IMAGE as CI/CD
# variables. An air-gapped Trivy also needs TRIVY_DB_REPOSITORY pointing at a mirror of its vulnerability database.

variables:
  SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
  RUNTIME_IMAGE: mcr.microsoft.com/dotnet/aspnet:10.0
  POSTGRES_IMAGE: postgres:16-alpine
  BUILDAH_IMAGE: quay.io/buildah/stable:latest
  TRIVY_IMAGE: aquasec/trivy:latest
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Set to "true" to run the browser tests too. They download Chromium, which an air-gapped runner can't.
  RUN_BROWSER_TESTS: "false"

stages:
  - test
  - build
  - scan
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# A throwaway Postgres beside the job. Its password is a test-only value for a container that lives as long as the job.
.postgres:
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
      variables:
        POSTGRES_USER: linkbase
        POSTGRES_PASSWORD: linkbase-ci-only
        POSTGRES_DB: postgres
  variables:
    LINKBASE_TEST_CONNECTION: "Host=postgres;Port=5432;Database=postgres;Username=linkbase;Password=linkbase-ci-only"

test:
  stage: test
  extends: .postgres
  image: $SDK_IMAGE
  cache:
    key:
      files: [src/Linkbase/Linkbase.csproj, tests/Linkbase.Tests/Linkbase.Tests.csproj]
    paths: [.nuget/packages]
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  script:
    - dotnet restore Linkbase.sln
    # Warnings are errors, from Directory.Build.props.
    - dotnet build Linkbase.sln -c Release --no-restore
    - |
      filter_args=""
      if [ "$RUN_BROWSER_TESTS" = "true" ]; then
        pwsh tests/Linkbase.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      else
        filter_args="--filter Category!=Browser"
      fi
      dotnet test tests/Linkbase.Tests -c Release --no-build $filter_args --logger "trx;LogFileName=results.trx" --results-directory TestResults
  artifacts:
    when: always
    expire_in: 14 days
    paths: [TestResults/]

image:
  stage: build
  image: $BUILDAH_IMAGE
  needs: [test]
  variables:
    # Unprivileged runners: no overlay mounts or user namespaces needed.
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah build --build-arg SDK_IMAGE="$SDK_IMAGE" --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" -t "$IMAGE" .
    - buildah push "$IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest"
        buildah push "$CI_REGISTRY_IMAGE:latest"
      fi

scan:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs: [image]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    # Reports known vulnerabilities without failing the pipeline, since most come from the base image and are fixed by
    # rebuilding when it's updated. Raise --exit-code to 1 to make them block.
    - trivy image --exit-code 0 --severity CRITICAL,HIGH --ignore-unfixed "$IMAGE"
    - trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE"
  artifacts:
    expire_in: 90 days
    paths: [sbom.cdx.json]

# GitOps: points an overlay at the image just built and pushes that, for Argo CD to roll out. Only on the default branch,
# and only once GITOPS_TOKEN is set: a project access token with write_repository, as a masked CI/CD variable.
# GITOPS_OVERLAY picks the overlay. The commit says [skip ci], so it doesn't start another pipeline.
deploy-tag:
  stage: deploy
  image: alpine:3.20
  needs: [scan]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITOPS_TOKEN
  variables:
    GITOPS_OVERLAY: deploy/kustomize/overlays/openshift
  script:
    - apk add --no-cache git kustomize
    - cd "$GITOPS_OVERLAY" && kustomize edit set image "linkbase=$IMAGE" && cd "$CI_PROJECT_DIR"
    - git config user.name "Linkbase CI"
    - git config user.email "ci@linkbase.invalid"
    - git commit -am "Deploy $CI_COMMIT_SHORT_SHA to $GITOPS_OVERLAY [skip ci]"
    - git push "https://oauth2:${GITOPS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
