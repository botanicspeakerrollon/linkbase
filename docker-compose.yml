name: linkbase

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkbase
      POSTGRES_USER: linkbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-dev.ps1 to create .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - linkbase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkbase -d linkbase"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The app as a container, only with --profile app, so `docker compose up` still starts just the database:
  #   docker compose --profile app run --rm app model migrate
  #   docker compose --profile app up -d --build
  app:
    profiles: [app]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Linkbase: Host=db;Port=5432;Database=linkbase;Username=linkbase;Password=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  linkbase-data:
